<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b5cd9'/%3E%3Cg stroke='%23fff' stroke-width='4.5' stroke-linecap='round'%3E%3Cpath d='M17 21h30M17 32h30M17 43h19'/%3E%3C/g%3E%3C/svg%3E">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹏基石材 · 视频文稿库</title>

<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e5e7eb; --line2:#eef0f3;
  --tx:#1f2328; --tx2:#5c6570; --tx3:#8b95a1;
  --accent:#2b5cd9; --accent-soft:#eaf0ff; --side:322px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab2bd;background-clip:content-box;border:3px solid transparent}

/* ================= 左侧筛选栏 ================= */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--line2)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.brand .sub{margin-top:6px;font-size:12.5px;color:var(--tx3);line-height:1.75}
.brand .sub b{color:var(--tx2);font-weight:600}
.search{padding:14px 18px 10px}
.search input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fafbfc;outline:none;transition:.15s}
.search input[type=text]:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search .deep{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.search .deep input{width:14px;height:14px;margin:0}
.filters{flex:1;overflow-y:auto;padding:2px 18px 18px;overscroll-behavior:contain}
.grp{margin-top:15px}
.grp>h3{margin:0 0 8px;font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.5px;
  display:flex;justify-content:space-between;align-items:center}
.grp>h3 .clr{font-weight:500;color:var(--accent);cursor:pointer;font-size:11.5px;visibility:hidden}
.grp.on>h3 .clr{visibility:visible}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--tx2);transition:.13s;max-width:100%}
.chip:hover{border-color:#c3cbd6;background:#fafbfd}
.chip .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sel .n{color:#c9d8ff}
.chip.zero{opacity:.34} .chip.zero:hover{border-color:var(--line);background:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.subchips{max-height:200px;overflow-y:auto;padding-right:4px;margin-right:-4px}
.subchips .chip{font-size:12px;padding:3px 8px}
.sfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;background:#fcfcfd}
.sfoot .cnt{font-size:13px;color:var(--tx2)}
.sfoot .cnt b{color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}
.btn-ghost{padding:6px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;
  color:var(--tx2);background:#fff}
.btn-ghost:hover{border-color:#c3cbd6;color:var(--tx)}

/* ================= 右侧主区 ================= */
.main{margin-left:var(--side);height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 26px 10px;border-bottom:1px solid var(--line)}
.topbar .res{font-size:13.5px;color:var(--tx2)}
.topbar .res b{color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}
.topbar .sp{flex:1}
.topbar label{font-size:12.5px;color:var(--tx3);margin-right:5px}
.topbar select{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;
  outline:none;font-size:13px}
.topbar .swapv{display:none;margin-left:8px;font-size:12.5px;color:var(--tx3);text-decoration:none;
  border-bottom:1px dashed #d5dae1;padding-bottom:1px}
.topbar .swapv:hover{color:var(--accent);border-color:var(--accent)}
.directory-link{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;
  border:1px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}
.directory-link:hover{background:#dce6ff}
.directory-link[hidden]{display:none!important}
.filter-toggle,.close-filters{display:none}
.filter-overlay[hidden]{display:none!important}
.filter-edge,.drawer-edge{display:none}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 26px 0;min-height:0}
.crumbs .cr{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:2px 9px;cursor:pointer}
.crumbs .cr:hover{background:#dbe6ff}
.listwrap{flex:1;overflow-y:auto;padding:6px 26px 80px;overscroll-behavior:contain}
.row{display:flex;gap:14px;padding:15px 14px;border-bottom:1px solid var(--line2);cursor:pointer;
  border-radius:5px;transition:background .12s}
.row:hover{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.row .no{width:34px;flex:none;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;padding-top:4px}
.row .bd{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:600;line-height:1.5}
.row .m{margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--tx3)}
.row .m .sep{color:#d9dee5}
.row .s{margin-top:7px;font-size:13.5px;color:var(--tx2);line-height:1.68;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bdg{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.bdg.soft{background:#f1f3f6;color:#5c6570}
.bdg.dup{background:#fff3e0;color:#b45309}
.empty{padding:80px 20px;text-align:center;color:var(--tx3);font-size:14px;line-height:2.1}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 0 4px;flex-wrap:wrap}
.pager button{min-width:34px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  background:#fff;font-size:13px;color:var(--tx2)}
.pager button:hover:not(:disabled){border-color:#c3cbd6;color:var(--tx)}
.pager button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}

/* ================= 阅读层 ================= */
.reader{position:fixed;inset:0;background:rgba(20,24,31,.42);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .2s}
.reader.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(1040px,100%);background:#fff;
  box-shadow:-14px 0 44px rgba(16,24,40,.2);transform:translateX(30px);opacity:.5;
  transition:transform .24s cubic-bezier(.32,.72,0,1),opacity .24s;display:flex;flex-direction:column}
.reader.open .sheet{transform:none;opacity:1}
.rhead{display:flex;align-items:center;gap:9px;padding:12px 22px;border-bottom:1px solid var(--line2);flex:none}
.rhead .sp{flex:1}
.rhead button{padding:6px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;
  color:var(--tx2);background:#fff}
.rhead button:hover:not(:disabled){border-color:#c3cbd6;color:var(--tx)}
.rhead button:disabled{opacity:.35;cursor:default}
.rbody{flex:1;overflow-y:auto;padding:34px 22px 130px;overscroll-behavior:contain}
.art{max-width:770px;margin:0 auto;line-height:1.95;color:#20242b}
.art h1{font-size:1.42em;line-height:1.5;margin:0 0 16px;letter-spacing:.2px}
.art .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--tx3);
  padding-bottom:16px;border-bottom:1px solid var(--line2);margin-bottom:20px}
.art p{margin:0 0 1.02em;text-align:justify;word-break:break-word}
.loading{padding:80px;text-align:center;color:var(--tx3);font-size:14px;line-height:2}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;
  padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.hint.on{opacity:.93}
@media(max-width:700px){
  .side{width:min(322px,88vw);transform:translateX(-105%);transition:transform .2s;z-index:40}
  .side.open{transform:none}
  .filter-edge{display:block;position:fixed;left:0;top:0;bottom:0;width:28px;z-index:38;touch-action:pan-y}
  .filter-edge::after{content:"";position:absolute;left:5px;top:47%;width:3px;height:40px;border-radius:3px;background:#c3cbd6;opacity:.7;pointer-events:none}
  .drawer-edge{display:block;position:absolute;right:0;top:0;bottom:0;width:30px;z-index:2;touch-action:pan-y}
  .drawer-edge::after{content:"";position:absolute;right:6px;top:47%;width:3px;height:40px;border-radius:3px;background:#c3cbd6;opacity:.7;pointer-events:none}
  .filter-overlay{position:fixed;inset:0;background:rgba(20,24,31,.42);z-index:39}
  .filter-toggle,.close-filters{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 9px;font-size:13px}
  .close-filters{float:right}
  .main{margin-left:0}
  .topbar{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .topbar .sp{flex-basis:100%;height:0}
  .listwrap{padding:5px 12px 60px}
  .crumbs{padding:8px 12px 0}
  .row{padding:14px 8px;gap:8px}
  .rhead{padding:10px 12px;flex-wrap:wrap;gap:6px}
  .rhead .sp{display:none}
  .rhead button,.rhead .directory-link{padding:5px 8px;font-size:12px}
  .rbody{padding:22px 16px 90px}
}
</style>
</head>

</div>

const BODIES=["很多装饰公司、很多石材厂家，垮掉就是这样垮掉的。你看现在搞建筑的、搞装修的，只要是劳务分包的，都活不下去啦。你们作为管理，老陈，你这样天天进进出出，我不相信你没看到这个问题。昨天才一个一个地带，今天又这样换，这些都是工艺品啊，难度很大，做工很复杂的。老蒋，你过来看一下，你自己看这个位置不会碰坏掉吗？边上碰爆边，再找借口说……像我们在车间里面，管理是很规范的。你们都是收别人很容易，自己干得没干得像样一点。这个不要动，下午把所有人喊过来，全部培训。老蒋，我们做一个班组长，管理你除了管安全以外，第二要管这些形象工程，第三要管我们的工艺技术，第四要把这个进度拉起来。不然你凭什么拿这个钱啊？你就拿一个劳务分包吗？找几个工人过来，就赚点那个人工费抽成吗？你像这样子思维以后，你就没有头路干啦。很多装饰公司、很多石材厂家，垮掉就是这样垮掉的。感觉好像请了一帮人，都好像在现场，应该要去做工艺品的，现在没问题，实际上注意看，问题一大堆，气得要死。不要以为每次都铺上去干、靠体力干就可以赚钱，不是的。这个时代不是靠体力赚钱，靠脑子来赚钱的，靠嘴巴、靠眼睛。一到三万块的奖励，我是亲口告诉你，你看你现在这样子，我怎么奖励？到时候一说我画大饼，你以为我是傻的啊？我就听你们说\"工地完工啦，我任务完成啦\"。我在过程当中也要看你们水平，完成也要看你们水平，我还要调查客户呢。你做得好，我该结钱结够。中国人十几亿人，不缺人，就缺人才。你在这十几亿人当中去混饭吃，还是他妈的这样子瞎混，你瞎混混不了几次。","现在是整个都拆掉吗？我原来这个地方是挡水的，我是专门开了一个槽的，没用的，但没用得好奇怪。什么没用的？张总你没懂得。你看那个槽，不管是冲洗还是落雨，多的水都从槽流了；其它矮的地方，它从那个门到那里就流不出来。哦，懂了懂了，我这个地方有槽的，没问题。但别的地方就有问题了。吴姐你比我还懂，我洗了地它也是这样。不能出问题，就像海绵一样，把水一直吸在铺贴层的沙浆里面。但是晒个两三天也会干，水泥的盐分反上来了。这个也是我们当时没经验。正常的坝子，下面都是土，水会自己泄到下面去；它这个是地下室，它是现浇出来的一个楼板，靠了几个排水口就不够。是因为铺贴层，干沙浆找平了，因为这是传统的方法。现在很多酒店大门口的车道，为什么还会下陷？就是干沙浆它的凝固度，就没有那个湿干浆凝固得好，所以造成这种泡水。还有主要是这个坡度，坡度没有排到那个最低点。这一次要铺的材料，也不能用这个水泥，直接用那个薄贴，无碱的那种水泥来薄贴。如果找平找得好，不做沙灰了，那既然要重新做防水，我们就再往下沉，整个边上全部做沟，做完之后你这一块就不会积水了。","很可怕了。那个背景墙，整个条高有一米，那个石头一米都长了，大块头的重量将近两吨。如果它要这样做的话，它下面那个地板跟地面的地板，绝对会被倾向墙的那边压破掉。这个不上钢架吗？你这个石材弄在木材上面，做不了了。现在就把底座背出来，直接打个点，支撑一个点出来。时间长了还是会变形，因为你拿个很重的石头，你把力量打在这两个地方，打这个地方拉出来，打这个横梁部打在这里就行了。石材属于易碎、难得又重，很多人不懂，全部打那个木基层。难道最后石头撑上去，这么软的东西，它哪里承受得了石材的重量？吊顶的石膏板要打掉，不然你挂上去，到时候受不了，没地方拉。因为我们这个第一排，所有的力都在这一块，它下面我们已经装了地暖，它地暖层是松的，它是泡沫，一压下去下层个五毫米，整个都出问题。一定要单一条脉调出来，每一块的力气分开。如果你们价格不够，还可以跟业主讲，这是他自己不小心，他自己挖了坑，绝对是设计师想的，因为设计师本身也不懂石材。所以我认为，理解他们这个施工，大家都以为是把它固定到墙上就行了。实际上整个重量要在底层，连地板都爆。为什么要钢架在墙上？钢结构墙上就是把整个墙面的石材，垂直力把它分解掉。这个是常识。做石材不只是我们一个石材装进去就行了，它有木作、有玻璃，你要知道别人是怎么做的，我们才能跟别人配合。","我们去采访一下我的员工，他们现在存款有多少。李师傅李师傅，你现在存款有好多？没得好多，一二三十万，还买了个房子啊。那你现在每个月的工资有多少？一万多点点嘛。你现在存款有多少？十多万分的有。那你赚的钱哪里去了啊？还房贷、装房子了吗？你现在一个月的工资有多少？大概就五六千嘛。你现在存款有多少？十万十多万。多少？两万多。你以前赚的钱花到哪里去了啊？小孩读书啊，养过小孩，一个高中一个大学的，他们一年要花你多少？一年的话可能是九万左右。还有一个老的大动个手术。你现在工资一个月拿多少？一万八千多九千呢。没有，我看的工资表你都是有，正常都是一万多的。你没有，你可能看那个月要高着呀。那我还要努力啊，我还要努力啊。加油加油。一两万块钱呢，听起来呢不多，但你要存一两万块钱，确实很难。两三百块钱不多，但你每天要赚两三百块钱，几乎不可能。一天一分都不挣，那很容易；但是你要一天一分都不花，几乎不可能。所以不管你是做什么职业的，只要人赚钱，赚多赚少都是赚。人不花钱的，那才叫不花。没事早点睡，别想那些没用的，一辈子的事，你一个晚上是想不通的。","我现在就在中国的最南边，这个小镇叫石井，它的海对面就是台湾省。这个小镇，是最早把石头出口到全世界的地方。我们来欣赏一下，从小我在这里长大的小镇，它的建筑风格是怎么样的。你看对面那个是马赛克，是很早最早的那个马赛克做外墙的建筑。前面那个，这个是水磨砂的外墙，这个建筑是非常有魅力的。这三个路口的建筑，都是六七十年代的建筑。相传这里到处是石头、没有土壤，我们只能在石头上刮水来喝。这个不起眼的地方，竟然出现了一个历史上很出名的大族，他叫郑成功，是他把荷寇赶出台湾的，这就是他的故居。最近很多人专门到这里，祈求发道成功。每次我回到家乡，就像被打了鸡血一样，热血沸腾，干劲十足。因为这里的人很有智慧，也特别拼搏。有人的地方就有福建人，有福建人的地方就有石井。这里教会我两件事：一件呢，像打篮球一样，热血拼搏、不服输；第二件事，像石头一样的质朴坚硬、脚踏实地。鹏基石材从这里走出去，把一块沉甸甸几亿年的石头，赋予艺术的生命。今天我们回到家乡，为家乡的村BA助力。福建人的拼搏精神，到哪里都能看到，仅仅是联谊赛而已，都有CBA国家队王哲林带队PK。鹏基石材无论走到哪里，根基都在这里，永远扎在家乡的石头上。鹏基石材助家乡石井镇的村BA圆满成功。新春之际，我也祝屏幕前的你，马到成功、跃马扬鞭、马上发财。","做石材，不可能像不锈钢、不可能像木材那么标准，实业做不到，误差肯定有。有多大误差？你是不是没有规范？这一毫米都长，不是不是。下工，我们要看什么工艺好不好，这又怎么长？这全露的。应该是不锈钢高度不够。我们这个是一公分，它这个尺寸是跟你们石材图纸下的，石材图纸我们就是一公分。它这个有一公分吗？它做不进去了，这里面的基础才打的，做不进去。要不要我把图拿过来？才一个尺寸，有什么卡的，你敢不敢卡？老伙计，你把那个图打开嘛。这是不锈钢嘛，你现在的不锈钢跟它这个平度是对的，它这个是比它深了，所以就会造成这个有个口。如果是这样做的误差也正常啦，是大家没想到它跟它之间的关系。但是现在在施工的时候我们可以补救，让它不锈钢做个头来压它，这是一个收口技术而已。到时候贴不锈钢的人，我来跟他对接好吗？你想的是每一个都是一个尺寸，你不锈钢折下来，我这个折过来是不是？那个缝子这么大，那个折过来是不是缝子这么小？我就折这个边是不是都不一样？我这个折过来是不是缝子这么大，所有的缝子都跑掉五毫米，哪有那么准。下工啊，做石头不像木头，因为石头它比较重，它块头比较大。第一，基层也会有误差；第二，我们石材的厚薄也会有误差，它一点来一点去，偏差就大了。这肯定有啦，材料它是有厚薄的。我们在开槽的时候是槽上开的，我这一块的块头可能比它厚，开出来它就深。因为我们现在看的是看面，不知道它背后的厚度，就造成了这样的情况。我认为我这个标准已经很精致了，你牛逼你再找一个，看能不能超过我。你不要说那个做别的，没有用。我也轻易不会让你们去返工，这些家伙来不及了。就是你拿这个石头条，把它一个堵，堵的意思跟它平，是吗？对。美中不足啊，等一下晚上我再想一下怎么搞。按正常，如果你这样压进去，它这里有个灯，不锈钢这个铁皮来收它的口，感觉这块板很厚，很漂亮啊。下工之后叫我要用石头来把它补起来，真的真难看，补的话绝对我会被詹老师骂死。让不锈钢来搞定吧。按你这个手法，这个感觉就是整个做了一个平衡嘛，对，谢谢啦。","现在所有的地产商，都在统一的起跑线上，就看谁给客户创造最高的价值，谁就能活得更好。这个地产公司呢，不是很出名，但是它很实干，比那些你耳熟能详的地产商，投入还大。它的定位、它的设计，在全国很难看得到。单单一个售楼部，请的是大牌的设计师来设计，请了全国各地很多优秀的工匠来做。整个屋檐，全部是用拉丝式的不锈钢来做的造型，吊顶也是，墙面全部是做异形的石材，难度非常大的，非常吸睛的装修效果。楼盘的董事长，亲自从云南跑到成都来找鹏基。我们是专门做私宅别墅的，成本高、做工满，但是呢，他非常地舍得。他要找的就是私宅的工艺，做工装的效果，定制这些高难度的、起伏型的造型。荒料定制，工艺难度非常地大，只有这样的用心，才能捕获业主的芳心。整个售楼部石材用了三千多平方，连部这个起伏型的造型，你看，没有一块地方是平板，没有一块地方是石板。单单这个桅杆，就花了五百多万，摆在正中间，非常震撼，整个场面就不一样。所有的玻璃幕墙，超强的中空隔音，森林级的状态。这个老板非常地超前，他就是要每个业主住进来以后，这种私密感与高级感、尊贵感。我看得都想买，可是做石材靠点手工艺赚点小钱，买不起。用天花板的思路来干这样一个盘，这个盘听说现在还没有开盘，但已经排号排得差不多了。","不要以为天然的石材是人工造出来的。石材它是从山上开采的时候，就一块一块的，像这种大石头一样。像这块石头从山上开出来，再经过海运，到达了我们的加工基地，再切成一些板材或者一些型材。比如你要做成一个异形的圆柱，或者你做成一个花台，或者你做成这种拉槽面的、这种板材类的，加工方式都不一样的。所以传统在市面上看的一些石材，大家都以为它天生是一片一片的，不是的，它天生就是一块大石头，我们再切割成无数的小石头。所以石材不是一个传统的装修材料。石材它从几千年古埃及到古希腊，它都是一个最高级的装修材料。","管理工地啊，说白了对每件事情都不信任，带着一种怀疑的眼光去检查。这个石头它是莱姆石，很容易脏的。安装以后清理干净，一定要叫王启春用无机硅，要记住，无机硅哦，在现场把它做保护。不然以后很容易，剩那个青苔乱七八槽的。这个东西做好了跟我汇报一下，不然到时候，它米白色变成黑色很难看的。管理工地必须要点对点地盯着，每做一件事情，你要提前预防它的出错。这个缝，甲煌自己安装的，到时候叫王启春，一定要把这个缝切开，要单独打那个结构胶。那个还要稍微磨一下，把它磨得很顺很平。因为它水是要从这里流下来的，如果整个水平不平的话，它有些地方是流水，就这样流水，很难看的。这里面花了两千多万，就是用两年马上拆掉，管它用两年，我一样用两百年的功力来做。这个你可以做两个，我们中间背一个板，对，把它做一条缝，这样不锈钢卡进去，它就有轴线的味道，放料味的好看。自己算自己的账，没有去算到不锈钢的账。兄弟你做不锈钢的是不是？嗯。这样子你帮我看一下，如果是我们尺寸错的，我们赔给你，这个钱我们单独付，好不好？实际上这些问题啊，你任何一个普通的业主来看，都看不懂，但是呢，跟装修有关的人，一看就看出毛病了。你看最起码误差三毫米。这些肚子大了，你就把那个弧度的那地方磨了，把它削进去，不然那个视觉看起来不顺，磨到拐过来那个地方就行了。哦对对对，就在这里就行了。做石头，你要做到分毫不差，那不可能啊。这花不了一个工的，一个弧形可能花不了一个，但是好几十个啊，数一下嘛，数一下几个，你给我单独报。我们这装修的这个效果，全是按木头的工艺来做石头啊。两个人一天，四人做四块，你们好，九十多公分宽、厚度二十公分，整块一块石头，把它装在墙上，那要花多大的劲？我们是人工加设备，不能扛都扛不上。因为这个业务说白了吧，人做出来的人很少，但是看得懂的人很多。就像煮饭一样，人煮好吃的，不一定很多人会煮，但吃得出味道的人很多。","不管是外墙还是石材的干挂，龙骨的预埋板一定要打在横梁上。比如顶上的梁跟中间的梁。像地面上没有梁的做法呢，就一定要把这个砖敲开，再做一个假梁，把预埋板受力在假梁上面，假梁再受力在地下的主梁上面，整个才是符合这种结构的受力。那这个北方的环境跟南方还不一样，北方比较冷，你没有地暖的话，这个会等于废掉了。有地暖的石材，我们在施工的这个要求就要更高了。市面上很多那种加固的铺铅网，就是用树脂胶来做加固网的那种，像这种有地暖一定要剔除掉。如果不剔除掉以后，热胀冷缩它会空壳、会空鼓。所以在南方很少看到有什么空鼓现象，但北方很经常。它那个供暖的热度很热，如果直接铺的话，不到两年绝对就脱层了。脱层石材一敲就是空的，然后就容易断裂。很多人做石材呢，都会守在工厂里面，但是我做石材呢，我就守在工地上。工厂的规范管理，对我来说已经很快，熟烂了。到了工地上，能够发现前面前置的一些问题，包括前面流程哪里出问题，连我都知道。现在最重要还是终端，就是我们的施工端。","真的没想到吧，很多传统的微小型老公司，现在活得非常地好，而且业绩还最真。我经常到处学习，参观一些优秀的公司，发现很多隐形的小公司，闷声发财。深入了解，实在让我收获非常大。最近我们公司呢，也开始大换血，突然实在干不下去了。今年我们总体的收益呢，赶超前两年。我把这个小小的成功呢，分享给大家。我的网名，石材小王子，在成都经营一家三百多号人的高端装修、石材定制工厂。这条赛道非常地窄，现在的市场经济，对我们的行业最受直接影响，未来百分之八十以上必须要倒闭。这不是我太悲观，这是现实，因为未来的建设量没了。在六年前，我就感觉这个市场有点不对劲，政策方向在变化，消费者身份都是八零九零。那个时候呢，我是开始大动作地挣扎，研究调整经营模式、产品定位，也对员工再培养。很多老员工呢转不过弯，甚至抗拒、抱怨，我吼。这些人呢，到了这几年，就开始发现自己完全不行了，但又不知道怎么去应对。这个时候呢，我做了一个断臂式的大动作。第一，产品落后、业务不行的部门管理者，全部给我下到一线；第二，一线人员没有价值产出的，全部优化；第三，寻找三十岁以下的新人，开始培养新一代的优秀同行；第四，机器设备更新换代，想尽一切办法去提高产品品质和效率；第五，砍掉一切浪费，特别是杜绝一切的形式化的礼仪；第六，组织架构扁平化。我是个小老板，就要接地气地带头干，不要依赖管理层，不抱怨团队。一切的源头，在于我老板自己。我们坚定信心，要打造下一个十年的模式。很奇怪，全国很多地方的超级豪宅，跑到成都来买鹏基石材，很多客户还是大明星、大网红。经过这些折腾以后，我体会到，想做一个老板，我就要敢于试错，喜欢接受新事物。五年前我就开始尝试拍摄自媒体，我根本不会去理会别人怎么看我，为我的梦想，我把钱赚到了就行。我想，我如果自己都不能跟上这个时代，我就不配当这个老板的角色。团队带不起来可以换，但是老板不能换。老板必须要经常逼自己一把。我是从不在意别人怎么看我的。真正呢，在你穷途末路的时候，那些说三道四的人，只会看你笑话；而能够帮助你的，只有我们自己。日子呢是自己过的，我们做的别人是看不懂的，只有用成功来说明一切。加油吧，屏幕前的小老板们，我们的未来十年一定会更加地好。","老百姓的福利来啦。现在的地产商呢，也跟着十五五规划的脚步，开始减品质、减价格啦。这是我们给中国农投地产公司、四川西集团石材幕墙做的一个效果。你想不到吗？石材跟铁艺是可以组合成一种编织藤的效果。它跟石材经过雕刻，做成一个斜切片以后，再跟铁艺组合在一起。这个施工完以后，整个墙面就像编织藤的效果。你看现在他们要求非常高啦，整个石材的这种材质，这是用一块水晶石来做的，下面都用一块莱姆石。你看我们做的这个阳角一定要非常地垂直，包括这个缝隙，这个缝隙一定要宽度一致，整个弧度要一致，还有板面抛出的光泽度一定要很亮才行。现在呢，制作工艺跟施工工艺已经大于一块材料啦。所以他们对这种细节加工工艺、材质的质感要求非常地高。而且现在的干挂，你看，我们用的都是背栓，用背栓挂。栓柱豪宅，装修的一个爆点来啦。以前做地产装修，批量的精装都是封样模式，怎么来得便宜、怎么来得快，能够垫资就怎么干。而现在的地产商已经不是了，他专门去找行业里面做私宅、做高端装修非常厉害的这些商家，来给他呈现现在的这种精装的效果。买得起这种高端的房子，他都是走南闯北，所以他要求是非常高的。你必须要有这些有钱人的生活经历，以及你对有钱人的审美高度，你要足够地同步，你才能做出这些豪宅业主能够认可的石材品质。所以这里面现在很多地产商已经认知到这一点了，他们开始减品次、减价格，这才是优质的地产商的思维。","今年是十五五开局，你准备好了吗？我准备了一些应对的方法，也许对你有帮助。厦门国际石材展内部演讲，干货连载第一集。组织结构的进化的第一步呢，我们必须要会做这个个体化事务，进化成团队合作制，实现组织化结构经营。这以前呢，老板一个人一条龙服务，你单单管理成本你都搞不定，没办法养很多优秀的人才。第二，会做多人作业，就是不要想到一个人把所有东西干完，因为你什么都会干、什么都不精，就没有竞争力。所以我们要培养专业、专工、精深的人才结构。第三，现在据我了解，很多石材商家还在搞固定薪酬。固定薪酬是最害人的，它很容易会做形式化主义。我们必须设计激励型的薪酬，低底薪、高提成。如果对业务不是很稳定的商家呢，我建议我们可以加个保底。像鹏基呢，已经有快二十多年了，我一开始就这样干，多劳多得，反而这样子呢，能够自动淘汰一些不良的人，然后留下来的都是能干的人。第四，我们要会做不匹配的人员跟岗位。因为现在十四五规划出来了，整个时代已经发生了天翻地覆的变化，成本最大的是人员结构成本。这几年鹏基我换掉很多老员工，甚至有些年龄不像很老，但是思维已经老化了，我就把它换掉，全部招一些有学习能力的，不一定年轻，但是有学习力的这样一帮人。现在的高端家装消费群体，发生了很大的变化，六零七零的消费者已经逐渐在消失，而现在的新主流客群已经是八零九零了。有很明显的叫什么？懒人经济、颜值经济，就是为了享受、为品味、为美丽、为服务价值买单，而不是一块物品。所以呢，我们再思考一下，如果我们要增加附加值、提升我们的服务价值来增加我们的客单值，我们石材该怎么办？关注我，我在下一集进行答案解答。如果我的分享能对你带来帮助，请点赞转发。","这个工序，这个就偷工减料啦，我叫他过来，屌一下。那边差五公分，那边差三公分，那边差四公分，安装的问题。这个槽是不是在工厂做的？是。问题出在哪里？你现在做这个施工面，你是没有放线的。放线的啊，你狗屁！你会不会按中轴线来放吗？放啊。这槽是中轴线，那地面有没有按中轴线？还有地面当时是按着这个屏幕，你太慢了。你看，你地面也要中轴线，比如这条是中轴线，你所有的九十度都放好，哪里存在这个地方会偏嘛？我们本来这个房子都是规整的，我们的墙体哪里有平的呢？必须要根据中轴线来铺。这个线是所有人共用的。你是那边铺过来的是吗？嗯。那你那边铺过来，到这边都有几十米啦，你那边误差个两毫米，到这边就两公分啦嘛。我们这个竹子，你问他们现在排了多少？到了排了十一个了。老贾，我跟你讲，那边肯定偏啦，那边大这边小，肯定有，我们去看一下，走。我干石材三十几年了，下面的人，满意的人敢骗我？屁股一抬，我就是跟他这样。你看，就是大不大肉燥，就是你看，这边就小了，然后这边这么大你看。我在铺石材，我这几块石材规格是一样的，我只要这一块一偏，所以就要跟着它歪，不然做不了密缝。铺的时候中轴线一晃。如果我这个石材切割有大小头，我也可以才知道这个顶点有问题。做装修啊，你进场我们就要研究中轴线在哪里。有了中轴线以外，开始放前面的垂直线，然后吊顶线、水平线，包括我们这些拐角线，都要放。这个叫五步放线，这个叫五步放线，懂不懂？你想依它这个拱度，这个也不一定准啊，它有的时候这个拱度出来五毫米，这个柱子也包了这么多，我知道，但是我的柱子啊，加工可能有误差。我们做装修，你不要去依任何的材料、任何装修面，你就依中轴线、以吊顶线、以水平线。你墙面不平，它就找平，我就用钢构、用结构来把墙面找平，绝对不能依墙面歪，我跟它歪。这个是规律，这是常识，这是标准啊。你狗屁的这样干。还有是什么？以后要这样，我们中轴线如果是从这里开始放，我到了另外一个区域，每个空间要独立地放中轴线，不能依大空间的中轴线。因为我们每块石材没办法做到零误差，那偏差我们就再交接出去修，保证每个空间它都是对的，保证每个厅一定是正方形的。下一次不能这样干啊。做石材都做了几十年了，它是懂的，我也经常培训，它是偷工，它认为放线麻烦，它不认为修这个麻烦。你放线，一天两个人就干完了。这种高难度的，你不要去找一些老油条的包工头，他就不懂技术，一定要找那种懂技术的来包，管理上我们来派人给他，单独配人来管理。","我们图纸是看这个视角，但实际安装完是看这个视角。所以我们正常的安装完，是看这个面，不是看这个面。我也可以跟甲方说，这个按图施工啊，但是这个图有的时候你没成形出来，它看不出来的。再牛逼的设计师，他都把不了关到这么到位。整个是墙角的阳角线，深度还是有点欠缺。你现在见不清的情况下，大面积近看你就看得到，但是眼它没那个轮廓。拿回来这个修一下，简单来说，就要像屁股一样、屁股沟那种感觉，它本来就是屁股的形状嘛。你理想你这个是大屁股，这个看起来就很木讷。就以这个底部，这里保证有个二十五就行了，大概下去六毫米的深度就够了。CAD图纸上的一个尺寸，表达的是这个工艺的造型。试装以后就会发现，这个深度不够的，阳角就不明显。这个就可以了，这个尺度就刚刚好。我问你，完成面的这个线条的效果好不好？做一个试装，这样可以，留二点六就行了，这个阳角才够明显。我问你，OK。","在成都，你想玩一场不一样的音乐会，就来这里。在这种废弃的矿坑里面，发现了这样一座古老的圣殿。在这个圣殿里面，举办一场古老的音乐会，想一想这种是什么感觉？古埃及的人脸狮身像，我们的三大女神：爱情女神、美丽女神、智慧女神。你看这是古希腊的柱廊，这一堆是古埃及的残垣断壁。在这样一种氛围里面，你去想想这个音乐会，会是一种什么样的感觉。","今天我一定要把十年前的一个技术曝光。我们很多石头的加工，是跟木头学的。我有一次在工地上施工，发现一个木工，他成批量地开槽，就这样一直在开槽，我就不知道他开槽到底干什么，我就看到图纸上好像没有这样。后来发现他们成批量开槽以后，原来是做这个弧形的。他整个弧形，他这开槽直接就可以弯了，就按照槽的间隙，人工就可以把它压出来。你看正面他就很平，你看，他正面看不到槽。所以后来我就把它用在石材的加工，我们在十几年前，就用这样来做一个弧板。正常做石材的弧面加工，第一种就是放料切弧。但放料切弧有一个问题，就是跟它交接的平板，很容易出现色差、纹路对不上。第二种平板来折弧，就会出现很多交缝，折弯出来不自然。第三种就是我今天要讲的，切槽加工工艺。我们这个石材跟旁边的平板是对纹、连纹的，颜色的纹路连在一起。软一点的，像砂岩、大理石的材质，你完全可以这样做；但花岗岩、硬石就不能做，太脆的、太硬的不能这样，软一点的可以这样做，你就看不出来。","你想当老板吗？那一定要听完我这个故事。我是典型的败家子。九零年代初，我在一家石材工坊当打磨工，月薪三百。那个时候看到很多人自己当老板创业，赚了钱，那个样子真的很赚。我呢，坐不住了，把家里面养的两头猪卖了，两千块钱，打算去倒卖皮鞋，没成想，不到一年全败光了。我又把父母种的、和邻居种的西瓜，凑了一大货车，拉去广东卖。刚到深圳就下起很大的暴雨，一车西瓜两万多元，全部烂掉。九五年，听说广东的石材生意好做，妈妈呢，就拿了家里面仅剩的四千块钱，让我到广东开了一家石材档口，找人赊了十几万的石材货物。三年后呢，我把所有的东西败光了，还负债三十多万。那个时候的三十多万，相当于现在的三千多万。我几乎呢，是把钱丢在地上任人捡。很多人都说我是一个败家子。到了九九年的时候，我实在真的撑不下去了，母亲找了好几家呢，借了六百块钱，而且拿着我跑了。我为了省路费，就一路偷偷地搭乘运货火车，到达成都，投靠亲戚。那个时候呢，没地方住，我只能寄宿在老乡的石材工厂宿舍里面。稳定下来以后呢，就开始跑石材业务。也许是求生的欲望太强烈，或者是真的开窍了，第一年我就拿了成都经济开发区和证监大厦的两个项目，净赚三十多万。还债再投资以后，我身上呢，只剩下一万多元。我就靠着赊来的场地和设备，创办起成都同济石材的第一个工厂。没有后援，我就找朋友借。我一个人自己跑业务、自己加工、自己施工，一个人一条龙服务。到了零三年，那个时候我就开始筹建第二家石材工厂。到了二零零六年的时候，我的销售已经突破上亿。二零零七年呢，我三十一岁，担任起成都南岸商会创会会长，还入选政协委员。我以为这些平台可以让我整合很多商业资源，其实是浪费精力、又浪费金钱，每年为商会开销上百万，而且还累得个半死。到了二零零八年，业务增长很快，但也出现很多应收账款呆滞，经常发不出工资、发不出薪水。那个时候开始，我就会春节守着收款，到除夕夜，最晚的一班会计才能回家过年。到了二零一零年后呢，我就坚决不再做工装业务，开始专注在小打小闹的家装业务上。这个地方是我们的工程技术服务部，主要是针对工地上的放样、测量、安装等等的工程技术服务，保证一个施工完的效果。其实呢，我是从一个坑又跳到另外一个坑。家装跟工装完全不一样，单量小、数量又杂、服务多、周期长、人员配置都管理重、费用又高，一直亏损。在探索石材家装这条路上，单单为了提高加工的精准度，我就花了好几百万，买了一堆没有用的设备。我也不断地去想办法提升自己，人家一推荐有什么好的课程，我必须听。我还修完了西南财大的MBA，还研习了意大利的设计和艺术。在学习的道路上，我至少花费上千万。二零一六年，我投资了两千多万，打造了一个石材展馆，名叫石材盒子，刚刚装修完就遇到了拆迁，全部打水漂。接下来呢，我悔得肠子都青了。一辈子是死，我爱面子、讲义气，去帮了好几家人做担保，两三千万，他们最后无力偿还，全部来找我要钱。既然做了，敢做敢当嘛，我就开始到处收款还债。很让我生气的是，我之前借给亲戚朋友的钱都收不回来，又差点把自己辛辛苦苦几年的钱败光了。到了二零一九年，房地产开始爆雷，很多应收款都成为死债。接下来呢，市场下降非常地严重。为了止损，我关掉了刚装修几百万、没有人流量的门店。然后呢，我转战线上业务，尝试做抖音、小红书，厚着脸皮，扮演不同的角色，拍不同的视频，想要突破，但呢，一点用处都没有。我呢，不断在反省思考，是一次次的败家，给我的礼物就是让我不断去超越自己的智慧，去经营这份事业。那种毫无退路的恐惧感，硬生生地把我逼出了一个毛病，那就是对拿到手上的业务，严苛精细到变态的地步。我用雕刻的眼光去雕刻每一个细节，哪怕是亏本，我也要把它干得漂漂亮亮。我必须要把它每个工程，像艺术装置一样来打造。很让我惊讶的是，现在我们的业务还在增长，出口的业务，像美国、东南亚国家以及欧洲都在增长，还承接了全国很多高端酒店写字楼的石材供应。家装石材是一个个性化、高标准的定制产业，产量有限。我们是吃着技术饭、靠着手艺挣点小钱。做这份工作，能让我自豪的是，我服务的客户，全部是各行各业的顶尖精英，能够和他们成为很好的朋友，也吸引到北上广深很多明星名流到成都来买高端石材。我带人去吃饭，我一生有事故，也有故事，丰富多彩。不管情况怎么样，我对石材的热爱，没有退路，也没有尽头。我的梦想，是在成都打造一家世界级的隐形石材小工厂。你的梦想是什么呢？","找点东西不好了，花点款，我今天又扣不了工资啦。这个地方当时没有按到我的要求，这个我要扣款啦。装修好不好看细节，你牛逼吹得再大，那我们就看这个细节的牛逼敢不敢吹。我们很喜欢玩自然纹路的拼凑效果。这块石头是一块花岗岩，叫银杏木纹，一条一条金丝银丝在一起的这种木纹的效果，整块大板绿色的地方是对得上的。唯一的没有做好就是，把这个纹路再对上去会更好，这个纹路能顺到这个台阶上，那就是玩到极致了，这就是一个深化设计的人力。我们在铺贴木头的时候，底下必须要找一个基层，这个木头贴上去以后它不会晃动，保持跟石材之间是平的。木头的热胀冷缩的系数大于石头，所以这个缝它必须要有。但为了防止粉尘渗入这个缝隙当中，我们就打了一个这样的收口胶。我们石材跟这个钢制栏杆之间的接缝，一毫米，可以说无缝衔接。如果是这个地方，材质跟石材的接缝之间，除了看到这个缝有胶啊、或者很粗啊，这次施工是很烂的。常规的一些想法就是利用规格来套材，提高这个出材率。所以这铺贴规格小了，它的缝隙就多。就做天然石材啊，我们尽量地找这种大块头，它这个缝隙容易暴露一些错落的点，块头越大越干净、越整洁，会高级。这个一定要改进。装修啊，可以任何地方都不用石材，但是卫生间必须用石材。它石材是矿物质，它可以吸潮、吸味，卫生间里面会保持味道清新。台面板现在做的一定是无缝，这个胶呢可以不打，时间长了这个胶还是会掉。天然的石材去铺贴，把它做密缝就行了，等来石材就已经挡水了，干嘛又增加了一个挡水条？多此一举，这边的浪费，人家业主的钱也不容易啊。收口在这里断掉了是不对的，它应该跟它上面一样的，应该跟木作的要去协商，不能各做各的。做豪宅装修，设计和材料都是不分家的，紧密地联合在一起。","如果你发现我们哪里做错，我就五百块现金奖励给你，真的真的，我会亲自送到你手上。我供应的石材，然后你来贴，出问题到底谁来担这个责任？铺贴是整个产品落地的最后一个环节，贴是最重要的。那要抛光一下、补一下吗？不行，不能抛不能补，必须换新的。你亏人工来装，我亏材料，好不好？我们一起把它干好。我是只供材料，我也要负责到底。那这个石材就是什么鬼咧？它就是一点都不能沾，但你自己浇一切，喷到水它就马上反应。这个莱姆石是很好看，但是就很脆弱，我们一定要把它的矿物质保护得非常好才行。这个你是不是很多脏的东西嘛？它就会沁进去，所以你在这个水管这里它就变成这样子了。这个封口胶一定要打凹进去三毫米，呈现这种石头的块头感。如果你打平了，首先它的这个表面就感觉像瓷砖；第二呢，这里会沉淀污垢；还有胶呢，冒在表层，太阳热胀冷缩，胶的寿命就很短。我来考你这个技术：假设这个表面、这个窗框这个阳角，它已经碍着你了，怎么办？它只能把石材抓来了。它是有线形的，整个一条线形过来的，对，它这个石头就不好收了。我们做工地检查，你对这个工艺一定要懂，不然你就不知道它到底是有没有做假。首先这个线，你可以跟着拐过来，抵住它，这个面折过去，其实只能从这里折了，从这里折下去，直接抵住它，那这样它就是一个很完整的。你不要小看一个窗套，这样做出来就看起来很舒服、很精致。这个颜色，它没有自然过渡形成的一种拼接的缝，这个工艺是做得不到位。标准的就是一米之外，你不能看到有缝隙。如果一米之外看到有缝隙，那肯定要么就是胶色没调好，第二接缝太粗。你看这边就很完美。这个门窗框的气角线跟窗户框的气角线，不需要一个高度。因为这一个我是要出气的，这个我不是要出气的。人家好不容易有这么敞亮的一个窗户，这个门槛高个五公分，它的视线就更压抑，那这个取决于我们的深化设计师对空间的理解。周工，如果改一下可不可以？可以啊，谢谢哦。因为会影响一点工期，但我们还是不留遗憾嘛。","抱一下。你只是老板，这里啊，这个不能接缝啊，这个没干好。你就没有考虑，它的难度在哪里？要不然，你来示范一块，这个怎么弄、怎么干？为什么老板他会有这个要求？承担的责任不一样。前提是，我不是唯一的一个老板，会不会有竞争？你不干别人可以干。老板是不是需要更聪明、眼界更高？我没有引领大家往前走，那下面兄弟们就跟不上了。我们是以世界的顶尖的、做石材的那个地方——意大利的标准来衡量这个东西。我问你，你见过没有？没见过。你要去挑战。当你技术高了，你就有机会来跟我叫板了：你不给我加工资，老子不跟你干。但是这个活路呢，你今天当学徒，或者当个普通师傅，可能想不出来；当你有一天把它搞成功了，你的价值就不一样了。那，比如这一块我干好了，下一块你老板这里有个工地，兄弟啊，这里有个工地，过来帮我干，你肯定这个想要。他通了，来来来，抱一下。太聪明了，一点就通。你要给个微信给我，你有空要到我工厂来，我们交个朋友。我收入可能比你高一点，但我承担的责任比你大。我不认真，可能明天我连打工都没机会。像我这种，抬石头没有你们有力气，如果我这个公司垮了，我去应聘个保安，别人要我？实际上我们是大家坐在一条船上。我当老板，我要有高度。我没有要求我们，怎么去跟别人竞争？我要让人家知道，装修别墅豪宅、买石材，要到成都，而不是在广东、福建。装修石材安装的，一定是四川的石材最牛，而不是福建、广东。","它影响不了你的预算，影响不了你的利润。你这个黄丝是所谓要套材。很多做石材的，为了省材料，他们的材料只占一点点东西，材料是很便宜的，主要是工艺感。来看一下这个线套，这个线套也不错，也是硬的。我们这个接口在这里接的，是可以的。就我们不是在这里有穿肩的，我们是在这里接的。哎呀，狗屁的，又给你做中缝了。你看你看，这种是一个低级错误。这里我要给你解释一下。好，你说。因为整个板当时是竖起来套的，板子这样跨是不够的，所以导致了现在这个位置，就是这种大框然后接了个中缝。再这样切的话，这纹路连不上，你本身也没连上，如果再接就是三个花了，要从三张板子上去接板子了。一般正常会装修，或者有经验的业主，他的视觉会钻到牛角尖。一般是什么？我先看你的脚，你脚的细节做精不精致，去考察你的工艺。实际上这个脚是最难的，所以我就干脆直接用整块来刻。那你担心的是纹路对不上，你这里也没有对上，你这里也没有对上，你这里也没有对上。我如果再接一块，然后这里就是三张板子来拼。不不不，不是这个问题，这张板子色差，你可以从别的地方去掏一个跟它颜色一样的来对。要干就这么较劲。如果我整块石材纹路吹不起，你从下一块，反正从大方料里面，也是那一块方料切出来的，肯定有。你这个方式就是所谓要套材，对吧？你省一点材料，但是问题你出不了效果。套材没多少钱，材料是很便宜的，主要是工艺。实际上你这个做，这个线条的工艺成本是很高的，还有施工成本高。所以很多做石材的，为了省材料，材料只占一点点东西，你何必在乎这个呢？它影响不了你的预算，影响不了你的利润。","这是工地，不能停车，马上开走。啊，谁啊？阿别碰超，超超，阿别碰超，超超。又停五分钟又必须走。阿别碰超，超超，阿别碰超，超超。等一下，问你一个问题，什么是真正的朋友？我很喜欢这样的朋友：有事呢，经常很细致；没事呢，各自忙各自的。这种关系呢，不需要特殊的回复，但是，问题。交朋友呢，不一定要交有钱有事，但你一定要交有情有义的。真正的朋友，总会在你非凡的时候刻意地离开你，而在你落魄的时候，他会及时赶到，永远不会袖手旁观。","哇，这个有个底逆间，这样的基础是不是不行呢？我们不能做。地漏在这里，地漏就这么高，下不去了。如果面上石材有着水，但是底下铺贴层，这是泡水的，石材就会产生泛碱，泛碱就这样来的。左右的房间，盘都是这样。这个地方是大屋子，那这个包裹就做错了，这个是个大屋子。我有个想法，你看这样行不行？重新做基础，把这个地方抬高，然后水往那边流。以后这个底逆间会高于外面，可能大概三到五公分，我认为没问题。我做了一个门槛，断开就行了。当初设计的时候，平了以后再抬，就感觉多高。做完以后，那个淋浴间比外面高，那都死死的。实际上有洁癖的人，还喜欢淋浴间高一点。我到时候都增加一条挡水条，先出个方案吧，好吧。这个地方也不可能去敲啊。二层还行，不行，没用，一点用处都没用。那怎么拆？就从这个地方进入，往这里面盘，就在这个平面上。那边比地漏的位置矮，你要站在这两排，除非这里你开个口。对啊，这开个口就破坏存水效果，把这个也不敲出来吗？钻口，空间，你用手指摸一下，它已经破坏到存水的位置了。二次排水是在，本来它就矮，我做排水才有用；如果你本来这一节都这么高，我二次排水它也流不出去。它这个地方都比这里矮，这个水都是倒流的。你现在方案怎么弄？我的意思是这样的：你重新找平，靠外方全部给我做断水，水往这边流一公分坡度，然后再做防水。我算了一下，有些往这边刚好，我尽量薄贴，我把边上敲出来，全部做防水，就圆起来了。对，坡度就按一公分就够了，不要多，你使劲往下压。我这边铺贴的时候，使劲做薄贴，我们就不做沙浆贴了。你的那个找平，一定要找得很平，误差不要超过五毫米。第二个就是，我们在做防水的时候，边上这些也要跟着，要把它这个靠边上，它有可能会又流到这里来。所以每一间都这样做，就没问题了。","不要去在意别人怎么看你。你看，全世界的人都在为自己而努力，没有人有时间去在意你。所有的一切都是为了自己，怎么开心怎么来。没有天赋，干就对了。","现在这里面变成小溪里面的黄红地，整个楼盘要装修都会来这里看一下。这做了多少年了？这个外墙，从开工到现在最少四年，连青苔都没有。我们做的这个抗污工艺是高温浸泡、渗透的抗污工艺。正常的施工，地面墙角会有脏的、有青苔，你看我们干干净净。它这是跟材料有关系还是跟工艺有关系？工艺有关系，跟材料没有任何关系。可是后面的这个护理啊，怎么样？不是不是，哪有什么护理啊，这石材装完就是装完了，加工上的一个工艺。如何来防止石材受到雨水酸性的腐蚀，以及地面的这个脏污，我是打造了重庆的一个石材的新标杆。你看比如这个柱子，我们就会通常，它的施工难度会很大，但是出来的效果会很好。整个拱用荒料来做。还有，你看整个用岩石料，这种才有欧洲的那种石材做出来的这种气场。很多这种工厂跟品牌它是这样：哎，你钱没给够啊，你当然做不好啊。我认为这个是最傻的做法。你要创造的是超过于客户期望值的价值，你的生存力就会很强。这个线条可能是一体的，对对对对对，它是一体的，就会牢固。比如，搬装落地，甚至有可能超过它材料本身的价格。我们材料不是说一定要贵，地上材料这些就是普通材料啊，做出来一样也会有很高级的感觉。石材不懂一瓷砖了，一瓷砖是属于工业化产品，它是定制的，它只有品牌价值；而我们石材，它是工艺价值。你的工艺到达什么样的境界，甚至你的设计搭配到达什么样的境界，去烘托出它的价值，它不是材料价格。我们一百块的材料，我可以干出一万块的价值。","这是我刚刚完成的一个石头里面包裹的雕塑作品，古希腊的圣女女神，整个比例跟它的原着是一模一样的。有不同的地方就是，这是一块石头雕着一个海水，然后这是用一个原石料雕出来的一个船头，又有这种古石年代感。我们要表达的是石材建筑的历史，它是从古埃及、古希腊演变而来的。我们是大自然的搬运工，我们搬运着世界的石头，来表达石材的世界。","我现在在三十多米高的高空更换石材，现在这些石头全部在脱落了。下面是一条街道，时不时经常有人从这里过。哎呀，这个掉下去，石头掉下去砸下去，那是重大事故、重大奖。这个位置，这个位置全部掉了，这个位置是广告，打坏掉了，整个挂件都已经没有挂到这个石材了。妈的，这个施工单位到底是谁啊？一定要把他找出来。施工方吗？人什么什么都，根本没想到，你根本就没看。他怎么大胆用胶粘，他都想得出这活。对，国内就是对那种高空的东西，我们不好上来的、不好看的那种，他们工人就想出这种主意。你知道，我们在城市很多地方，主要外墙干挂石材，都隐藏了这种隐患。对，看小区交付啊，看什么都是看表面的，感觉表面没问题，实际上最重要是隐藏工艺、隐藏的结构、隐藏的施工能力。不要以为只是得到一个工钱而已，人在做天在看。说不定哪天你自己从那里路过，自己被自己的石头砸死。","这个封边，你看，在上海这样交不交，这样交不交啊，看了一点粗犷感都没有，看起来像石力的工艺。这种东西细节可不要出现。太重了，它肯定会破坏。人工手工的，做到你完工看不到是可以的。上海的项目我们其实也做过，我们这种水平过去，人家都很开心。已经修直了，你把它修直了，不能用这种矩形状，肯定的。这个我们是下一道工序的那种精磨的，就像地面一样。我看这个没刷线条，是不是可以？去哪卡一下，马上就知道。所以它卡，你看这边，你复一复的地方几个处理特别好。我们的标准，像这种看面的缝肯定是不能有缝隙的，但压缝的这个最后来处理是可以的。生火，它能控制得最好，你自己控制的会更好，谁都做不了。特意去要求这个也没问题，我就在厂里面等候就行了。那多了一道工序，因为这个线条它是属于设备压的，它有的时候压得会厚一点薄一点，一两毫米的出入。因为线条不薄有出不来，对，肯定有了。你说这问题，我以前学的时候实在是问了，我们的线条的误差，在我的标准里面，它是两毫米到三毫米，已经薄了。对对对，你这样去要求工人，把工人逼死了，没办法。我这不是工人问题，不是不是，那设备它会这样误差的。对，就是如果你不留缝的话，它很难干出来的，不可能的。这没人欠补一方的，没有，这个石材就这样子，这是石材啊。对对对，这套的可以，我以为是补一方的。这个石材那么小，你其他人还不惯点吗？我是整个组合在一起，装配师就是这样。你现在那么多人还没做结晶吗？没有没有做，只是安装好。对对对，只要我带你看看的，就是我的施工管理，以及我们装完的一个细节。我们那些的部分，全部都是有问题的。还有这些你处理不了，我这样做就有雕刻感，它做出来的这种，就像岩石头，然后这个细节看起来就很好看。如果你去正常这样接，你这个地方就不知道怎么接了。我们的深化能力很强大，这个我们是对美学、对材料的理解。","做防水，它只做一遍也不行，防水正常要做三遍，你知道吗？地产开发商做外墙隐蔽工程的，自身防水没做好，依赖的石材和打胶来挡这个防水，这是臭的。所以现在你看到处都在漏水。你看看这个，在漏水，它那个石材裂缝里面在渗水。哇，那这个东西怎么弄？不好找。但开发商当时在用这个石头也是很贵的，巴西进口的一个花岗岩，好材料，但是施工不当。不行，你看，这个捡来捡到那里还不是缝。如果你的墙面漏水，它下面就跟着漏了。维修真的比新建还麻烦。这些地方都是一个漏水的可能性，它无疑是从这个表面的石材渗水，渗到墙体，底下那些墙体可能是沉降，或是加建的，就裂开了。所以我们要解决的是，墙体要把它密封掉，然后表面的石材打胶把它密封掉，再管个二三十年。现在没办法把所有的石材扒开了，成本太高了。这个石材做完有多久了？二十多年了。你知道各种批量化装修，肯定是乱七八槽的。为什么这个墙体就换槽了？外面肯定也是做了防水，但是没做到位，所以这个也可以看出，当时那个做基层的人有多混蛋。因为防水外面的必须上翻就好，那应该是上翻，我跟你说上翻都有。防水要封到一点潮气都进不来才行。防水它只做一遍也不行，防水正常要做三遍，你知道吗？一层基层防水，一层卷材，然后那面上再一层柔性的防水，其他都不会出问题。你们讲的都是表面，很多人以为这个石材表面能防水，基础必须要做到万无一失。石材在表面它只是一个装饰。这个地方的漏水的可能性很多了，比如它地面的防水没做好，有些地方漏到那里，就从那里渗下去，它到处乱窜，跟这上面又没关系了。主要还是把那个主机撬开，把底下这个附一楼的这个大雨，万一从这个平面渗水进去，很有可能。先去这里观察，好好好，你这个建议非常好。它如果下雨，手足带头，它那个墙上还在挂水，我们就按照跟你说的那种方式，上面处理了。对对对，我们补业了。我们原来主力的一家是什么？比如它头上这样的渗水，它结果是这一头的水漏到那边去了。这个你怎么可以反映它？尽量能少花钱，能解决。","天然的石材品种太多了，它没规范。设计师看到，哎呀，这块很奇特，没人用，那我就把它用上去。他不会考虑到使用功能。下层做得好，这个下层的空间是足够的。这个地方是一个公共洗手台，地面的石材要看一下。有些设计上用的石材，如果它吸水力很强，还不能用。哦，那这个还要有花纹才好看，这个石头还要耐水。当那个台面会受污、容易受污，熊工这边在深化图的话，洗手台要谨慎，提个建议啊。我们要很专业，不是说设计师想用什么就用，因为很多设计师对使用功能上还是没有经验，有的时候后面出问题，这恰恰是我们要背锅。他认为是你的材料有问题，他不认为这个材料不适合用在哪里。张总，你也说那个石材的吸水力，有几个地方我都想到。第一是我们那个大兵馆那个，比如我们用的法纹布纹，那个材质也比较软，做地面、卫生间的地面，我们让他们换他也不换，出了什么问题呢？跟水泥粘合的时候，它就反起来，反了什么呢？就像那个霉斑一样的，印在材料上。我们一直说这个材料不行，但设计师就说你坚持用这个东西，我认定的东西，我觉得就是很好看，是很固执。很多施工方，包括甲方的人员，是很不负责的，都是想，哎呀，把它做完，赶快走了，工钱拿了，他就不管人家后面了。你看我们这种岁数的人，我们干活不是这样的，我要保证你以后使用没问题，终身能有保障。","不行，抓紧，快点快点，等一下等一下等一下，你们让开，让开让开。等一下等一下等一下，不动不动。为什么很多石材工厂他不愿意下这么大的规格？就是要推进房子里面来，是非常难的。往前走，把他拉这里或再倒。一旦铺那种两米以上的大块头的板，切得是漂亮的，平铺用干沙浆，一定要按这种搅拌站灌装的专用石材沙浆，反口的那种水泥跟沙拉到工地上，再由工程现场去搅拌，这是不公平的，容易造成铺贴的空鼓。整个基层扫平完了过后，我们在这个石材上面刮铁壳泥的胶泥，像不像以前小时候吃的麦芽糖？这个超大规格的石材，加工的难度跟铺贴的难度，不是普通的石材工厂或者一些工作人员就可以操作的。铺贴大板的师傅，一定要经过严格的培训。实际上它抬的方式方法很重要，如果你操作方式、你的搬运方式不一样，损害会非常地大。这个厅，整个大规格铺贴完了，两米乘三米的大板，每一张都是。我们干工地的人就是这样，你客户竟然信任我，那我绝对是干得跟别人不一样。我们四川人出门，就是干的脑袋比人家管用，干的东西别人想不到。","大板的石材已经破裂了，但是背后的这个网完好无损，它没有崩开，不会去伤害到人。所以我们这个背网是非常地牢固。这是刚刚我们切割出来的一片一片的石材，然后在这个板的背面上，我们加了一层高强度的玻纤，然后再涂上我们的背网胶，足足有两毫米的厚度。干透了以后，就好像一个防爆膜把它贴在上面，受到外力的撞击，它不会容易爆裂。背后这个背网胶的功能非常强大，它有一个重要的好处就是，可以防止地面的潮气往上拱，产生了一个泛碱跟泛污的石材病变的可能性。刚才讲的是属于背面的保护，石材的正面同样可以受保护。这个背网胶它可以渗透到石头的矿物质里面，可以增加它的硬度，而且把石头细微的孔洞全部封闭掉，外界的污渍跟水分都浸不进石头，可以让石头铺贴完以后，保持一种自然的光度和它这种自然的色彩。","建筑新规：不管是私宅还是公建，幕墙用天然大理石，必须三公分厚，而且必须背栓干挂，最主要的是施工方必须有资质，否则发生事故，业主跟施工方共同担责。这种私人别墅式的鹏基石材，严格按照最新规范和最新的工艺做出来的效果，颠覆了传统的石材工艺。材料用的也不是普通传统材料，这是一款石灰的莱姆石。这不是一款普通的莱姆石哦，它跟卢浮宫、凡尔赛宫是同款石材。不懂石材的人收莱姆石，很容易收污，这是一个错误的认知。这块石头非常地神奇，它时间越久，硬度和密度是越来越高，就像水泥一样，凝固期有三十年，也就是三十年以后，它这块石头的抗污能力是越来越强的。难怪欧洲几千年的建筑传承下来，越看越漂亮。整栋建筑的石材，我们用了一项专利工艺，把石材进行高温浸泡抗污的工艺，而且在每一个楼层，单独做了一个断水线，让下雨天的雨水和污垢不会从上往下流，会保持整个外墙干干净净、非常地整洁。鹏基石材还有一项很牛掰的工艺，我们的工艺可以处理到墙角，不会受污、不会长青苔。你看今天重庆市下大雨，地面上都是水，而且这个地面很脏，但是这个墙面的石材，它没有任何的污垢，非常地干燥、通透。整栋建筑的冷泡、还有窗套，以及墙线跟柱子，都是用岩石料整条加工出来的造型。室外石材严禁用胶水来粘，用板材再用胶水器粘出来的造型是很便宜，但是用在户外，日晒也用不到两年，肯定掉下来，万一砸到人怎么办？来看，这个墙体的缝隙都是不打胶的，这个难度非常地大，但是效果非常地精致、美观。我最满意的还是这跑户外的前梯，这些扶手还有栏杆以及底座，都是用岩石料来标轴切割出来的、起伏的一个造型，难度非常地大，工序也非常地多，但是出来的效果非常地震撼、非常地赞。入口这两根大柱，是用四米多的整块的岩石料来加工成岩形，里面的柱心是掏空的，再嵌入钢结构，又牢固又大气。这栋别墅装完以后，业主是非常地满意，越看越开心。这个小区里面一旦有装修的人，都会到这个房子来打卡。装修用天然大理石，确实非常地出效果。如果你的预算不够，建议你不要用天然大理石。我用我三十年做石材的经验告诉你，廉价的大理石工艺，烂到可以把你整个房子、所有其他的造价整个损坏掉。你只要想到用天然大理石，一定要造价给足，找到一位行业里面优质的厂家，货真价实地干，这样才能超出你想要的效果。装修享用天然大理石，请关注石材小王子，我来帮助你装石材不跳坑。","我跟你说，贴在这里，不出三个月，如果没掉下来，我脑袋砍给你玩。不管是水泡沙也好，或者外墙乳胶漆也好，做湿贴石材的话，坚决不能用，因为它会起壳的。你现在是准备用灌浆铺贴，还是用胶直接抹上去、再贴上去呢？我们现在没有一层嘛，然后石材在没有一层，才可以贴得住。我教你怎么做。首先第一层我们还是可以按传统的，能灌水浆就灌水浆，因为第一层它不会流出来，然后最底下你找平，你先放线，放完线过后，底下如果能抹，把底下的这个抹掉，然后灌点水这样下去，这是一个方法。然后第二个方法是，现在我们做这种外墙已经有乳胶漆了，千万不能直接贴，全部要铲掉。你看看到没有，它是没有任何附着力的。不管是水泡沙也好，或者外墙乳胶漆也好，做湿贴石材的话，坚决不能用的，因为它会起壳的。你看呢，都是这种乳胶漆，时间长了它要起壳。这个整个高度我看一下，应该是三米多，三米五。就我们国家规范，在三米五以内的墙体，室内室外是可以允许湿贴的，没有说一定要干挂。湿贴的前提是，研究墙体的基础是什么，那这个乳胶漆一定要铲掉，我们要看看里面的砖体是什么样。如果它是空心砖，或者它是那种轻质砖，不同的砖，我们的铺贴方式也要不一样。施工前你一定要把所有的项目、施工基础搞懂，这样的施工基础能不能做石材。它有些安装的事务班组，他也不懂的。你做管理，你要懂得去指导别人，不是随便安排个班组去想干。除这个窗子这一截，这一截是红砖，这一截是加气砌块砖，这个外墙的铺贴方式，我们就这样定了。这个外墙区先把它去掉，这肯定荔枝面的，荔枝面的铺抓力也是不行的。拷下去，把它拷到这个网，拼掉、去掉，把这个网去掉。那我们这边就是拷完光光的，我们还是要打龙骨挂。对，这一次这个项目还是亏了张元璋花钱，一天半三个人来搞这五块。做装修还是福建的师傅靠谱，四川的师傅来，那我跟你说，他绝对不会跟你这样干的，已经挂完了，早就挂完了，他也不会跟你讲，他还怕你知道。","这里不是贫民窟，也不是缅北，这里是住着起码上千个石材雕刻匠人的艺术家工作室。每个工作室有几十个平方，他们的作品、他们的创意都在这里面出现。这个作坊里面有不同的一个一个的小房间，就是小工作室，每个工作室里面都会有一个大师。这一带是缅甸的白玉石，所以根据它不同层次的花纹来设计出形状。这就是一个帆船，这个纯手工的雕刻，要雕着这样一个细细的绳子，你看，这个绳子的厚度只有两毫米，非常精致，非常精致，做得好，很厉害，很厉害。谢谢。你们是哪里的？这个是我的，你们是起雅？辽宁的，辽宁的，东北人搞雕刻还是第一次见到。东北辽宁有很多的东北大师、东北大汉。这个是万马奔腾，看到这件雕刻品的，你今年一定会想到，一定马到成功、马年吉祥。哇，你看这个花斗，淋淋精致，非常地精致，活灵活现。你看，哇呀，很适合用在那些中式大宅里面，镇宅之宝，这个是可以传承的。这一件呢，你如果要卖，要卖多少钱呢？二三十个吧，二三十个。我认为不只，我认为这样上百个都要，都值得。你看这个是水晶，水晶雕件，有不同的颜色，同样一块石头有一些阴阳色，根据它变化的色彩来设计它的作品。哇，大作品，大作品。每个大型的雕件都是根据石头大小来设计、来思考的，所以你买的这样的雕件，别人是买不到的。有没有看上的？看上的哪一件，直接在评论区留言。你们那个门店在哪里？这个门店哦，一个正门，反正放在这里，有喜欢的就过来拿。对，实际上他们每个工作室也是一个销售，一个人做的现场，这个叫现炒现卖。你看，它这个烟灰缸，怎么样的烟灰缸都有，这个小摆件也不贵的，十二生肖的烟灰缸，不贵不贵，一个也就几百块钱。所以你不要以为这些大师雕做出来，他们会喊得很高价，也不会。正常他们每个作品的计算方式，是按人工来算的，就是这样一个作品，我可能花费的是一个月，那一个月可能一天我的工资要两百块钱，我乘以三十天，就得出这样一块材料的人工成本，再加上原材料的成本，等于它的卖价。我们不能打扰他，他在专心地做作品。来再看一下。你看这是平面，这是一开始没雕之前先画个形状出来，配模出来之后又要继续画，粗坯的形状出来以后又继续画。所以要雕刻一个作品，像这个手工画画的水平要很高，他们一件作品基本上要画十到二十稿。所以这些雕刻师本身都很不容易，在这样一个环境下，要去创造美好的东西，好难。","今天厦门展，我都走到两万多步了，把这个脚底都走脱了。你看，二零二六厦门国际石材展，跟紧我，带你刷点好看的、好玩的、好新奇的。这家不知道干什么的，看不懂，好大的水刀喷头，小时候那个墨。这是一块生锈的石材，花了功夫了。泡沫的仿石材。夸张。这个比我们那个好，对，很帅。对，我们可以这样，木底板一样装，只要木底板的能装的，我们就能装。复合的这个碳纤维的底板，扔下去不会坏，不会坏。你看，新型的材料出来了，天然的石材可以做这么薄，才三毫米，而且还可以波浪形，比瓷砖还轻、还薄的一个工艺。对，这样在施工当中又快捷、快捷，又健康。一个是防爆，不需要去用水泥跟胶水铺贴，就可以，很牢固的一个材料。","我们两个一路向南检查工地，第一站，三亚，出发。二十一世纪什么最稀缺呢？人才。这是我们在海南三亚的私宅别墅项目，这里面的施工单位、设计师、材料商，个个是人才。你看装的怎么样？哇，这个吊顶，这家公司真的是真材实料。你看，一般这种都是用木龙骨啊、石膏板来切糊，同行被同行感动啦。你看，哇，这个基层做得这么好啊。这碳素板是什么板啊？牛逼啊，这样做基层哪里会出问题啊，这不可能啊。在海南这个地方的天气啊，它潮湿啊，木头的话很容易会变形，他用这个材质是对的。这张装空调做得很精致，相比的整个看起来很扎实。你看这个吊顶弧度，非常地柔顺、精致，这种角度上看起来很舒服。你看这个造型，全部是用钢构，非常地牢固，锁的管线，你看，非常整齐，很有层次感。你看吊顶，全部是五金龙骨，全部是钢制龙骨，这不是用什么立板去刮出来的造型，建交水泥的时候，直接就把这个柱型直接交出来了，直接一体成型。在中国做外墙保温防水的，竟然真的只有两家品牌可以做，一家是川东，一家是重庆的。这个比石头还硬的，又防水、又保温，最重要是隔音。它这个吊顶的骨架也做得好，全部用钢材来造型。你看，什么天气潮湿啊，什么东西来压都不会变形。这个项目都是中国的高手来干的，你不能丢脸啊。我们也是被人家摆在台面上的，你都说以前忙，就没上来检查，这种就会出问题。你看，像这些都还没焊到耶，这个漆是属下焊。把每个人的工位，你都给我拍照，我每天都在看了，每天晚上我是最少一个小时在看这个项目。做干挂的话，预埋板你一定要打到梁上面，地梁啊、天梁啊，就不能去打在砖上，因为砖它是不能受力的，它只能做隔墙，它不能做拉拔支撑力。你看，十八级地震都没问题。十五公分乘十公分的主龙骨，五号角钢全部是满焊的，这种石材受力在上面，才会足够地牢固。我们这预埋板不是市面上的预埋板，你看到没有？我们这个是两百三乘两百三，市面上一般都是一百八乘一百八、两百乘两百，市面上的厚度是五毫米，我们这个是一公分的，都是定制的。因为我们这个石头，一部分是五公分的，然后大部分是三公分的，厚度很厚。银粉刚才是喷啦，然后这个竟然这一喷上去，银粉就不在了，你看，好奇怪哦。把这个龙骨焊好以后要先检查，要直接扎，稍稍扎完过后就喷防锈，防锈要检查喷到位，然后再喷面漆。面漆实际上它是一个形象工程，看起来会干净整洁一点。那检查完毕，所有东西没问题了，我们才开始挂石材，流程是必须要走到位。","我第一次看幕墙工地，人配合做得这么好的一个铝合金门窗。这个门窗真的做得好好，溜冰溜冰。很多户框都是这样固定的，像这样固定就不牢固了。你看看那边，人家做的螺丝在上面固定，这个铝合金门窗是非常地懂技术的。这个就是铝合金窗的户框，他做得很好，把户框的防水都接到我们的这个基层防水上来了。幕墙保温防水也做得很到位。你看人家把这个保温层跟户框，是用结构胶板封死的，出来再做这个拨铅网，拨铅网跟他这边做了一层防水，防水出来再抗裂砂浆。非常用心地一个工地，他已经做好准备了。我们这石材做完了，铝框安装完了，我们在压胶的时候他再来堵这一块，人家是有准备了，牛逼啊。下次我有好的工地，一定要推荐这家来做。人家把这个防水捡起来，就捡到这里。但是问题是他施工没保护，造成积水，他这个是整个都转，整个屋面墙面到处都补做成防水，做的这层防水再做这个保温，用心啊，用心啊，配合。","错误了，而且是浪费。像这些东西都是给装修公司交的智商税。你看，这三根柱子都是要用石材来包，这个基层的木板全部都开来，你看，它全部是用气枪来固定的，一个小孔一个小孔，全部是用气枪打进去的。这个是用水泥浇灌的柱子，包板用它把它包起来。我不可能石材又放在这个木头上面，石材我又脆又硬又重，它把你这受得了？它木头是软的。既然我这个表面要做石材，我石材的架构一定跟基层的水泥去接触才行。如果我们石材是装在这上面，这个木头一变形，我表面的石材就真的变形了。而且它这个刨花板它是有味道的，如果石材把它包起来，这里面的味道散化不了，它一直都保留在这个空间里面。老是以为房间里面会有一点煤气味。像在国外，这种刨花板它都不会用的。","要记住，不管是地面墙面，只要刷了防护，它就跟水泥吃不了了，跟胶泥就吃不了了，所以必须加一层界面剂，不然它就会空。那就是先铲的空，先刷防护水再刷界面剂吗？对对对。那背后刷了界面剂，可以背后不用再刷防护了。界面剂是取得一个附着力，防护是防止水泥胶泥的渗透。比如我这个石材六个面，我做的防护，目的就是让外在的东西隔离开，跟水泥胶泥一样也是隔离，要吃不进去就空鼓了。所以一定要再刷一道界面剂，界面剂它就可以吸得住。在铺贴前这个石材背后往下去除，刷了界面剂之后，装那个五金件，把它倒提，再打内膨胀螺丝，就平口的，就像雨伞一样，内胀开了。把那个孔一打进去以后，把那个AB胶塞一点进去，膨胀螺丝再塞进去，然后再把它旋紧，旋紧它就胀开了，这AB胶跟加气砖就连固在一起了。每一层都要刮螺丝，还是？对，每一层都要，一块两个。我们排头，排的时候就还是灌水浆，把它灌满。地面是有石材的，好，那就一样，把这个地面呢，把它悬空，把水平线悬空个一公分，就是把石材完全面、地面完全面，它才一公分，它才不会潮气、才不上气。这个还是成一个标准。里面到时候在铺的时候，底下，你在排头的这一块，用那个灰刀把它刮平，从里面灌。你管一下，你不要冷却。你下面是先铺的，水浆你吸一点。我们先看第一排嘛，它这一排你直接塞，肯定很难找平的，先把铝棒拉起来一点点，三两毫米。等一下啊，这一台我们就按你这个意思弄，辛苦一下，大工等小工用。","石材要保证它铺贴完的效果，跟我们家的大板看起来是一样的，一定要解决的就是铺贴层的潮气、水汽。昨天这一排全部是用那个瓷砖胶的，带你看一下，你看，它这一块它很多东西就冒起来了，缝隙里面开始有潮气起来了。像这种瓷砖胶，不要去铺贴我们的石材。正常市面上瓷砖胶它是通用的，瓷砖胶它只考虑粘力，它就不会考虑水泥里面的碱性物质对石材的一些问题。兄弟们，跟你们比较一下就知道了。来，你们注意看，这一块就比那块要干燥一点，这一排的材料是用我们专用铺贴泥的，然后里面那一块全部是用瓷砖胶的。你看这些就比较干透，本来那个瓷砖胶我没有实测过，那昨天没有，他假装说那个可以用，他们很多不懂，造成问题天天来找我，你这就石材有质量问题。没有的话我们尽量就不干了，因为干出来后遗症很麻烦。你们很多是铺完就直接离开工地，实际上后续很多问题你们是不知道的。所以我给你们解释一下，主要是黑色的石材跟白色的石材，用到什么白水泥或者黑水泥，或者这种普通的瓷砖胶的话，它以后时间长了，它肯定会泛白花、木讷，白色的它就会泛碱、泛黄。现在这个基层，我们是用石材背胶跟石材的胶泥来铺贴的。我们看一下这个材料，我们叫铺贴的一定要用这种专用的石材铺贴泥。为什么叫专用？我说几个专用。首先第一，这个材料它用的高标号水泥是无碱的；第二，它这个材料它是带有防水的功能，所以它是有防水的功能，就是我们让地下的潮气不会往上拱，因为我们在干沙浆里面还是有水的，所以我们在用这个胶泥整个满刮的时候，一定要保证那个缝隙里面把胶泥挤满，它底下的潮气就不会往上拱；第三，它有拉力，它不是解决附着力而已，它能够拉住，能够让这个石材不会以后在使用的时候踩踏容易断裂。所以要记住，你们以后不要铺上去随便拿那个胶泥就铺，看看它是不是石材专用的，一定要有这四个字。"];

/* ================= 状态 ================= */
const S={src:new Set(),big:new Set(),topic:new Set(),blogger:new Set(),series:new Set(),
         bucket:new Set(),tag:new Set(),kw:"",deep:false,sort:"default",per:50,page:1};
let VIEW=[];           // 当前结果（X 的下标序列）

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US");
const topicsOf=it=>it.tp?String(it.tp).split(",").map(Number):[];
const tagsOf=it=>it.tg?String(it.tg).split(","):[];
const seriesName=it=>it.se<0?"":SERIES[it.se];
function hint(m,ms){const h=$("#hint");h.textContent=m;h.classList.add("on");
  clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove("on"),ms||2000);}

/* ================= 筛选 ================= */
function pass(i,skip){
  const it=X[i];
  if(skip!=="src" && S.src.size && !S.src.has(it.src)) return false;
  if(skip!=="big" && S.big.size && !S.big.has(it.big)) return false;
  if(skip!=="topic" && S.topic.size && !topicsOf(it).some(t=>S.topic.has(t))) return false;
  if(skip!=="blogger" && S.blogger.size && !S.blogger.has(it.bg)) return false;
  if(skip!=="series" && S.series.size && !S.series.has(it.se)) return false;
  if(skip!=="bucket" && S.bucket.size && !S.bucket.has(it.bk)) return false;
  if(skip!=="tag" && S.tag.size && !it.xg.some(t=>S.tag.has(t))) return false;
  if(S.kw){
    const k=S.kw.toLowerCase();
    let hay=(it.t+" "+it.s+" "+BLOGGER[it.bg]+" "+SRC[it.src]+" "+it.tg+" "+
             topicsOf(it).map(t=>TOPIC[t]).join(" ")+" "+seriesName(it)+" "+BIG[it.big]).toLowerCase();
    if(hay.indexOf(k)<0){
      const bt=bodyAt(i);
      if(!(S.deep && bt && bt.toLowerCase().indexOf(k)>=0)) return false;
    }
  }
  return true;
}
function counts(skip){
  const c=Object.create(null), all=(skip==="none");
  for(let i=0;i<X.length;i++){
    const it=X[i];
    if(!pass(i,skip)) continue;                 // 跳过该维度的过滤条件
    if(all||skip==="src")     c["s"+it.src]=(c["s"+it.src]||0)+1;
    if(all||skip==="big")     c["b"+it.big]=(c["b"+it.big]||0)+1;
    if(all||skip==="topic")   topicsOf(it).forEach(t=>c["t"+t]=(c["t"+t]||0)+1);
    if(all||skip==="blogger") c["g"+it.bg]=(c["g"+it.bg]||0)+1;
    if(all||skip==="series")  c["e"+it.se]=(c["e"+it.se]||0)+1;
    if(all||skip==="bucket")  c["k"+it.bk]=(c["k"+it.bk]||0)+1;
    if(all||skip==="tag")     it.xg.forEach(t=>c["x"+t]=(c["x"+t]||0)+1);
  }
  return c;
}
function visibleTopics(){
  if(!S.big.size) return TOPIC.map((_,i)=>i);
  const out=[];
  for(const b of S.big) (DATA.topicOfBig[BIG[b]]||[]).forEach(tp=>{
    const i=TOPIC.indexOf(tp); if(i>=0&&out.indexOf(i)<0) out.push(i);
  });
  out.sort((a,b)=>a-b); return out;
}
function visibleBloggers(){
  if(!S.src.size) return BLOGGER.map((_,i)=>i);
  const out=[];
  for(const s of S.src) (DATA.bloggerOfSrc[SRC[s]]||[]).forEach(b=>{
    const i=BLOGGER.indexOf(b); if(i>=0&&out.indexOf(i)<0) out.push(i);
  });
  out.sort((a,b)=>a-b); return out;
}

/* ================= 筛选栏渲染 ================= */
const CLRKEY={"①":["src","① 内容库"],"②":["big","② 主题大类"],"③":["topic","③ 细分主题"],
  "④":["blogger","④ 博主 / 作者"],"⑤":["series","⑤ 系列 / 合集"],"⑥":["bucket","⑥ 字数档"],
  "⑦":["tag","⑦ 热门标签"]};
function chipHTML(k,i,label,n,color){
  const sel=S[k].has(i)?" sel":"", z=(!n&&!S[k].has(i))?" zero":"";
  const dot=color?'<i class="dot" style="background:'+color+'"></i>':"";
  return '<button class="chip'+sel+z+'" data-k="'+k+'" data-i="'+i+'">'+dot+
         '<span>'+esc(label)+'</span><span class="n">'+n+'</span></button>';
}
function renderFilters(){
  let h="";
  const grp=(key,title,inner)=>'<div class="grp'+(S[key].size?" on":"")+
      '"><h3><span>'+title+'</span><span class="clr" data-clr="'+key+'">清除</span></h3>'+inner+'</div>';

  const sc=counts("src");
  let inner='<div class="chips">';
  SRC.forEach((s,i)=>{inner+=chipHTML("src",i,s,sc["s"+i]||0);});
  h+=grp("src","① 内容库（按原始 HTML 文件）",inner+"</div>");

  const bc=counts("big");
  inner='<div class="chips">';
  BIG.forEach((b,i)=>{inner+=chipHTML("big",i,b,bc["b"+i]||0,(BIGCOLOR[b]||[])[1]);});
  h+=grp("big","② 主题大类",inner+"</div>");

  const tc=counts("topic");
  const vis=visibleTopics().map(i=>({i,n:tc["t"+i]||0}))
      .filter(o=>o.n>0||S.topic.has(o.i)).sort((a,b)=>b.n-a.n);
  inner='<div class="chips subchips">';
  if(!vis.length) inner+='<span style="font-size:12.5px;color:#8b95a1">当前条件下没有可选细分，试试放宽其他条件</span>';
  vis.forEach(o=>{inner+=chipHTML("topic",o.i,TOPIC[o.i],o.n);});
  h+=grp("topic","③ 细分主题"+(S.big.size?"（限已选大类）":"（全部 "+TOPIC.length+" 个）"),inner+"</div>");

  const gc=counts("blogger");
  const vg=visibleBloggers().map(i=>({i,n:gc["g"+i]||0}))
      .filter(o=>o.n>0||S.blogger.has(o.i)).sort((a,b)=>b.n-a.n);
  inner='<div class="chips subchips">';
  vg.forEach(o=>{inner+=chipHTML("blogger",o.i,BLOGGER[o.i],o.n);});
  h+=grp("blogger","④ 博主 / 作者",inner+"</div>");

  const ec=counts("series");
  inner='<div class="chips">';
  SERIES.forEach((s,i)=>{inner+=chipHTML("series",i,s,ec["e"+i]||0);});
  h+=grp("series","⑤ 系列 / 合集",inner+"</div>");

  const kc=counts("bucket");
  inner='<div class="chips">';
  BUCKET.forEach((b,i)=>{inner+=chipHTML("bucket",i,b,kc["k"+i]||0);});
  h+=grp("bucket","⑥ 字数档",inner+"</div>");

  const xc=counts("tag");
  inner='<div class="chips subchips">';
  let shown=0;
  TAG.forEach((t,i)=>{const n=xc["x"+i]||0;
    if(n<3&&!S.tag.has(i)) return; shown++; inner+=chipHTML("tag",i,t,n);});
  if(!shown) inner+='<span style="font-size:12.5px;color:#8b95a1">当前条件下没有可用标签</span>';
  h+=grp("tag","⑦ 热门标签（随筛选动态）",inner+"</div>");

  const host=$("#filters"); host.innerHTML=h;
  host.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k, i=+el.dataset.i;
    if(S[k].has(i)) S[k].delete(i); else S[k].add(i);
    if(k==="big"){const ok=new Set(visibleTopics()); S.topic.forEach(t=>{if(!ok.has(t))S.topic.delete(t);});}
    if(k==="src"){const ok=new Set(visibleBloggers()); S.blogger.forEach(b=>{if(!ok.has(b))S.blogger.delete(b);});}
    S.page=1; render();
  });
  host.querySelectorAll(".clr").forEach(el=>el.onclick=()=>{
    S[el.dataset.clr].clear(); S.page=1; render();
  });
}

/* ================= 列表 ================= */
function compute(){
  VIEW=[];
  for(let i=0;i<X.length;i++) if(pass(i,"none")) VIEW.push(i);
  const s=S.sort;
  if(s==="han-") VIEW.sort((a,b)=>X[b].han-X[a].han);
  else if(s==="han+") VIEW.sort((a,b)=>X[a].han-X[b].han);
  else if(s==="title") VIEW.sort((a,b)=>X[a].t.localeCompare(X[b].t,"zh-Hans-CN"));
  else if(s==="src") VIEW.sort((a,b)=>(X[a].src-X[b].src)||(a-b));
}
function rowHTML(i,rank){
  const it=X[i], col=BIGCOLOR[BIG[it.big]]||["#f1f3f6","#5c6570"];
  return '<div class="row" data-i="'+i+'"><div class="no">'+rank+'</div><div class="bd">'+
    '<div class="t">'+esc(it.t)+
      '<span class="bdg" style="background:'+col[0]+';color:'+col[1]+';margin-left:8px">'+esc(BIG[it.big])+'</span>'+
      (it.dup?'<span class="bdg dup" style="margin-left:5px">同源重复</span>':'')+'</div>'+
    '<div class="m">'+topicsOf(it).map(t=>'<span class="bdg soft">'+esc(TOPIC[t])+'</span>').join("")+
      '<span class="sep">|</span><span>'+esc(SRC[it.src])+' · '+esc(BLOGGER[it.bg])+
      (seriesName(it)?' · '+esc(seriesName(it)):'')+' · '+fmt(it.han)+' 字 · '+esc(BUCKET[it.bk])+'</span></div>'+
    (it.s?'<div class="s">'+esc(it.s)+'</div>':'')+'</div></div>';
}
function renderCrumbs(){
  const out=[];
  const add=(k,v,label)=>out.push('<span class="cr" data-k="'+k+'" data-v="'+v+'">'+esc(label)+' ×</span>');
  S.src.forEach(i=>add("src",i,SRC[i]));
  S.big.forEach(i=>add("big",i,BIG[i]));
  S.topic.forEach(i=>add("topic",i,TOPIC[i]));
  S.blogger.forEach(i=>add("blogger",i,BLOGGER[i]));
  S.series.forEach(i=>add("series",i,SERIES[i]));
  S.bucket.forEach(i=>add("bucket",i,BUCKET[i]));
  S.tag.forEach(i=>add("tag","#"+TAG[i]));
  if(S.kw) out.push('<span class="cr" data-k="kw" data-v="0">关键词：'+esc(S.kw)+' ×</span>');
  const el=$("#crumbs"); el.innerHTML=out.join("");
  el.querySelectorAll(".cr").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(k==="kw"){S.kw=""; $("#kw").value="";} else S[k].delete(+c.dataset.v);
    S.page=1; render();
  });
}
function pagerHTML(pages){
  const p=S.page;
  const btn=(n,label,cur,dis)=>'<button class="'+(cur?"cur":"")+'"'+(dis?" disabled":"")+' data-p="'+n+'">'+label+'</button>';
  let h=btn(p-1,"‹",false,p<=1);
  const arr=[...new Set([1,pages,p,p-1,p+1,p-2,p+2])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
  let prev=0;
  arr.forEach(n=>{if(n-prev>1) h+='<span style="color:#8b95a1;padding:0 4px">…</span>';
    h+=btn(n,n,n===p,false); prev=n;});
  return h+btn(p+1,"›",false,p>=pages);
}
function render(){
  compute();
  const total=VIEW.length, pages=Math.max(1,Math.ceil(total/S.per));
  if(S.page>pages) S.page=pages;
  if(S.page<1) S.page=1;
  const st=(S.page-1)*S.per, seg=VIEW.slice(st,st+S.per);
  const w=$("#listwrap");
  if(!total){
    w.innerHTML='<div class="empty">没有符合条件的文稿<br>试试放宽筛选条件，或点左下角「清空全部筛选」</div>';
  }else{
    w.innerHTML=seg.map((i,k)=>rowHTML(i,st+k+1)).join("")+
      '<div class="pager" id="pagerBox">'+pagerHTML(pages)+'</div>';
    w.querySelectorAll(".row").forEach(r=>r.onclick=()=>openR(+r.dataset.i));
  }
  $("#hitN").textContent=fmt(total);
  $("#resN").textContent=fmt(total);
  $("#resP").textContent=S.page;
  $("#resT").textContent=pages;
  renderCrumbs(); renderFilters();
  if(!summariesReady&&!summaryPromise&&seg.some(i=>i>=50))
    ensureSummaries().then(render).catch(err=>hint(err.message,3000));
}

/* ================= 正文解压 ================= */
/* ========== 正文读取：单文件模式 / 分片按需模式 ========== */
const SHARD={}, SHARDLOAD={};
function loadShard(n){
  if(SHARD[n]) return Promise.resolve(SHARD[n]);
  if(SHARDLOAD[n]) return SHARDLOAD[n];
  SHARDLOAD[n]=new Promise((res,rej)=>{
    window.__wgWait=window.__wgWait||{};
    window.__wgWait[n]=res;
    var s=document.createElement("script");
    s.src=SHARD_PATH+(n<10?"0":"")+n+".js";
    s.onerror=function(){ SHARDLOAD[n]=null; rej(new Error("正文分片 "+n+" 加载失败，请检查网络后重试")); };
    document.head.appendChild(s);
  });
  return SHARDLOAD[n];
}
window.WG_PUSH=function(n,b64){
  try{
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip")))
      .text().then(t=>{ SHARD[n]=JSON.parse(t); const r=(window.__wgWait||{})[n]; if(r) r(SHARD[n]); })
      .catch(e=>{ const r=(window.__wgWait||{})[n]; if(r) r(Promise.reject(e)); });
  }catch(e){ const r=(window.__wgWait||{})[n]; if(r) r(Promise.reject(e)); }
};
function bodyAt(i){
  if(!SHARDED) return BODIES?BODIES[i]:null;
  return FULL?(FULL[X[i].sh]||[])[X[i].off]:null;
}
function ensureAllBodies(){
  if(!SHARDED) return ensureBodies();
  if(FULL) return Promise.resolve(FULL);
  const n=DATA.stats.shards, loaded=Array(n);
  let next=0;
  const worker=async()=>{
    while(next<n){const k=next++;loaded[k]=await loadShard(k);}
  };
  return Promise.all(Array.from({length:Math.min(6,n)},worker))
    .then(()=>{FULL=loaded;return FULL;});
}
function bodyOf(i){
  if(!SHARDED) return ensureBodies().then(l=>l[i]||"");
  return loadShard(X[i].sh).then(l=>l[X[i].off]||"");
}
function ensureBodies(){
  if(BODIES) return Promise.resolve(BODIES);
  if(bodying) return bodying;
  bodying=new Promise((res,rej)=>{
    try{
      if(typeof DecompressionStream==="undefined") throw new Error("浏览器不支持 DecompressionStream，请用较新版 Chrome / Edge / Safari");
      const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
      new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip")))
        .text().then(tx=>{BODIES=JSON.parse(tx); res(BODIES);}).catch(rej);
    }catch(e){rej(e);}
  });
  return bodying;
}
function toClip(t){
  if(navigator.clipboard) return navigator.clipboard.writeText(t);
  return new Promise(r=>{const a=document.createElement("textarea");a.value=t;
    document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();r();});
}

/* ================= 阅读层 ================= */
let CUR=-1, FONTSZ=17.5;
function openR(i){
  CUR=i;
  const it=X[i], col=BIGCOLOR[BIG[it.big]]||["#f1f3f6","#5c6570"];
  const head='<div class="art" style="font-size:'+FONTSZ+'px">'+
    '<h1>'+esc(it.t)+'</h1>'+
    '<div class="meta"><span class="bdg" style="background:'+col[0]+';color:'+col[1]+'">'+esc(BIG[it.big])+'</span>'+
      topicsOf(it).map(t=>'<span class="bdg soft">'+esc(TOPIC[t])+'</span>').join("")+
      '<span>'+esc(SRC[it.src])+' · '+esc(BLOGGER[it.bg])+
        (seriesName(it)?' · '+esc(seriesName(it)):'')+' · '+fmt(it.han)+' 字 · '+esc(BUCKET[it.bk])+'</span></div>';
  $("#rbody").innerHTML=head+'<div class="loading">正在读取正文…</div>';
  $("#reader").classList.add("open");
  document.body.style.overflow="hidden";
  const pos=VIEW.indexOf(i);
  $("#rPrev").disabled=pos<=0; $("#rNext").disabled=pos<0||pos>=VIEW.length-1;
  bodyOf(i).then(raw=>{
    const txt=(raw||"（本篇无正文）").replace(/^\s*摘要[：:]\s*/,"");
    const paras=txt.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean)
                   .map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
    $("#rbody").innerHTML=head+paras+"</div>";
    $("#rbody").scrollTop=0;
  }).catch(e=>{
    $("#rbody").innerHTML=head+'<div class="loading">正文解压失败：'+esc(e.message)+"</div>";
  });
}
function closeR(){ $("#reader").classList.remove("open"); document.body.style.overflow=""; }
function step(d){
  const pos=VIEW.indexOf(CUR); if(pos<0) return;
  const np=pos+d; if(np<0||np>=VIEW.length) return;
  openR(VIEW[np]);
}

function toggleFilters(open){
  $(".side").classList.toggle("open",open);
  $("#filterOverlay").hidden=!open;
  $("#showFilters").setAttribute("aria-expanded",String(open));
}
$("#showFilters").onclick=()=>toggleFilters(true);
$("#closeFilters").onclick=()=>toggleFilters(false);
$("#filterOverlay").onclick=()=>toggleFilters(false);
/* 手机上从主页面左边缘右滑打开筛选；从筛选页右边缘左滑返回。 */
function edgeSwipe(element,direction,allowed,done){
  let start=null;
  element.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch"||!allowed()) return;
    start={id:e.pointerId,x:e.clientX,y:e.clientY};
    try{element.setPointerCapture(e.pointerId);}catch(_){ }
  });
  element.addEventListener("pointermove",e=>{
    if(!start||start.id!==e.pointerId) return;
    const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>12){start=null;return;}
    if(dx*direction>55&&Math.abs(dx)>Math.abs(dy)*1.2){start=null;done();}
  });
  const end=()=>{start=null;};
  element.addEventListener("pointerup",end);
  element.addEventListener("pointercancel",end);
}
edgeSwipe($("#filterEdge"),1,
  ()=>!$(".side").classList.contains("open")&&!$("#reader").classList.contains("open"),
  ()=>toggleFilters(true));
edgeSwipe($("#drawerEdge"),-1,
  ()=>$(".side").classList.contains("open"),
  ()=>toggleFilters(false));

/* ================= 事件 ================= */
let kwT=null;
$("#kw").oninput=e=>{clearTimeout(kwT);
  kwT=setTimeout(()=>{
    const kw=e.target.value.trim();
    if(!kw){S.kw="";S.page=1;render();return;}
    ensureSummaries().then(()=>{
      if($("#kw").value.trim()!==kw) return;
      S.kw=kw;S.page=1;render();
    }).catch(err=>hint(err.message,3000));
  },150);};
$("#deep").onchange=e=>{
  S.deep=e.target.checked;
  if(S.deep){ hint("正在加载全部正文分片…",1800);
    ensureAllBodies().then(()=>{hint("全文索引就绪，已可搜索正文"); render();})
                 .catch(err=>{hint("解压失败："+err.message,3000); S.deep=false; $("#deep").checked=false;});
  } else render();
};
$("#sort").onchange=e=>{S.sort=e.target.value; S.page=1; render();};
$("#per").onchange=e=>{S.per=+e.target.value; S.page=1; render();};
$("#resetAll").onclick=()=>{
  ["src","big","topic","blogger","series","bucket","tag"].forEach(k=>S[k].clear());
  S.kw=""; $("#kw").value=""; $("#deep").checked=false; S.deep=false; S.page=1;
  render(); hint("已清空全部筛选");
};
$("#listwrap").onclick=e=>{
  const b=e.target.closest("#pagerBox button");
  if(b&&!b.disabled){S.page=+b.dataset.p; render();
    $("#listwrap").scrollTop=0;}
};
$("#rClose").onclick=closeR;
$("#rPrev").onclick=()=>step(-1);
$("#rNext").onclick=()=>step(1);
$("#rCopy").onclick=()=>{const it=X[CUR];
  bodyOf(CUR).then(tx=>toClip(tx).then(()=>hint("已复制《"+it.t+"》全文")));};
$("#rFontA").onclick=()=>{FONTSZ=Math.min(25,FONTSZ+1); openR(CUR);};
$("#rFontB").onclick=()=>{FONTSZ=Math.max(14,FONTSZ-1); openR(CUR);};
$("#reader").onclick=e=>{if(e.target.id==="reader") closeR();};
document.addEventListener("keydown",e=>{
  if($("#reader").classList.contains("open")){
    if(e.key==="Escape") closeR();
    else if(e.key==="ArrowLeft") step(-1);
    else if(e.key==="ArrowRight") step(1);
    return;
  }
  if(e.key==="Escape"&&$(".side").classList.contains("open")){toggleFilters(false);return;}
  if(e.key==="/"&&document.activeElement!==$("#kw")){e.preventDefault(); $("#kw").focus();}
});

/* ================= 首屏 ================= */
const ST=DATA.stats;
$("#brandSub").innerHTML="<b>"+fmt(ST.total)+"</b> 篇 · <b>"+fmt(ST.han)+"</b> 字<br>鹏基石材 · 视频口播文稿库";

render();

if(requestedArticle!==null && /^\d+$/.test(requestedArticle)){
  const index=Number(requestedArticle);
  if(index>=0 && index<X.length){
    $("#rBackDirectory").hidden=false;
    openR(index);
  }
}
